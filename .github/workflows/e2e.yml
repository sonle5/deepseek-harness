name: E2E (real DeepSeek API)

# Real-API end-to-end suite (`pnpm run test:e2e`). Unlike ci.yml this job
# consumes a model API key and hits an external endpoint. Repository variables
# select the endpoint: DSH_E2E_PROTOCOL (`anthropic-messages`, the default, or
# `openai-completions`), DSH_E2E_BASE_URL (default
# https://api.deepseek.com/anthropic under `anthropic-messages`, required under
# `openai-completions`) and DSH_E2E_MODEL. The key is the secret
# DSH_E2E_API_KEY, falling back to DEEPSEEK_API_KEY_EXTERNAL. Under
# `anthropic-messages` the test step maps it to DEEPSEEK_API_KEY and
# DEEPSEEK_BASE_URL, which every DeepSeek suite reads. Under
# `openai-completions` only the headless agent suites run, through an
# llm-pi-ai Chat Completions route; the DeepSeek-wire suites see no
# DEEPSEEK_API_KEY and skip.
#
# pull_request IS a trigger, but GitHub withholds repo secrets from BOTH forked
# PRs and Dependabot PRs (the latter are same-repo, fork==false, but still
# keyless). The job-level `if:` below skips the whole job for those untrusted
# PRs. The Dependabot test keys on the PR AUTHOR (pull_request.user.login), not
# github.actor (the run trigger) — a maintainer reopening a Dependabot PR would
# make github.actor human while the PR is still keyless. When the job runs
# without a key, the preflight skips the build and test steps with a notice
# and a step-summary line saying the real-API tests did not run, so a missing
# secret never reads as a passed suite. A job skipped by a job-level `if:`
# reports as a SUCCESSFUL check, so this workflow is safe to use as a required
# status check if desired.
#
# SECURITY — NEVER change this trigger to `pull_request_target`. `pull_request`
# checks out and runs the PR's HEAD code WITHOUT secrets for forks, which is what
# keeps an untrusted fork from exfiltrating the key. `pull_request_target` runs
# in the BASE repo's context WITH secrets while still able to check out untrusted
# fork code — a textbook key-leak vector, especially once this repo is public.
# The fork/secret model and its public-repo implications are recorded in
# .agents/notes/implemented/testing/2026-06-19-real-api-e2e-ci.md.
#
# Note: scheduled triggers are auto-disabled after 60 days of repo inactivity;
# push/pull_request/workflow_dispatch act as backstops.
on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    # 00:17 UTC nightly = 08:17 Asia/Shanghai — off the top-of-hour cron stampede.
    - cron: '17 0 * * *'

# Keep only the newest validation in each workflow/ref, including master and
# develop pushes, nightly runs, and manual dispatches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repo to run tests.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith'
          && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    name: e2e
    # Run on every trusted event. Skip untrusted PRs (forks + Dependabot) where
    # the secret is withheld. The head-repository match is the fork exclusion:
    # head.repo.fork is true for every PR when this repository is itself a fork.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]')
    # Profile e2e files can each own several complete dsh subprocess trees, so
    # four file workers preserve process/PTY headroom. Tests retain 120s/test
    # and retry 2; 45m still bounds retry storms against a slow API.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '^24.22.3'
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Restore verified bubblewrap archive
        id: bubblewrap-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dsh-ci/bubblewrap
          key: bubblewrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-bubblewrap.sh') }}

      # The with-key escalation e2e self-skips without a usable runner. Prepare
      # bwrap so trusted CI exercises it; the functional probe remains the
      # authority on whether the runner can use the sandbox.
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      # A restored archive whose digest fails is re-downloaded but not re-saved
      # (the hit key already exists), so a tampered entry survives until
      # eviction; that needs deliberate cache poisoning.
      - name: Save verified bubblewrap archive
        if: steps.bubblewrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/dsh-ci/bubblewrap
          key: bubblewrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-bubblewrap.sh') }}

      # The e2e suites self-skip without a key, so a keyless run would pass as
      # "all skipped". Skip the build and test steps instead, and say so in a
      # notice and the step summary. This step sees only whether a key exists,
      # never its value; the secret is scoped to the test step.
      - name: Preflight (real-API key and endpoint)
        id: key
        env:
          E2E_KEY_PRESENT: ${{ secrets.DSH_E2E_API_KEY != '' || secrets.DEEPSEEK_API_KEY_EXTERNAL != '' }}
          DSH_E2E_PROTOCOL: ${{ vars.DSH_E2E_PROTOCOL || 'anthropic-messages' }}
          DSH_E2E_BASE_URL: ${{ vars.DSH_E2E_BASE_URL || ((vars.DSH_E2E_PROTOCOL || 'anthropic-messages') == 'anthropic-messages' && 'https://api.deepseek.com/anthropic' || '') }}
          DSH_E2E_MODEL: ${{ vars.DSH_E2E_MODEL }}
        run: |
          set -euo pipefail
          case "$DSH_E2E_PROTOCOL" in
            anthropic-messages) ;;
            openai-completions)
              if [ -z "$DSH_E2E_BASE_URL" ] || [ -z "$DSH_E2E_MODEL" ]; then
                echo "::error::DSH_E2E_PROTOCOL=openai-completions requires the repository variables DSH_E2E_BASE_URL and DSH_E2E_MODEL."
                exit 1
              fi
              ;;
            *)
              echo "::error::DSH_E2E_PROTOCOL must be anthropic-messages or openai-completions, got '$DSH_E2E_PROTOCOL'."
              exit 1
              ;;
          esac
          if [ "$E2E_KEY_PRESENT" != true ]; then
            echo "::notice title=Real-API e2e skipped::Neither DSH_E2E_API_KEY nor DEEPSEEK_API_KEY_EXTERNAL is set; the real-API e2e tests did not run."
            echo "Real-API e2e tests did not run: neither DSH_E2E_API_KEY nor DEEPSEEK_API_KEY_EXTERNAL is set." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Real-API e2e targets $DSH_E2E_BASE_URL over $DSH_E2E_PROTOCOL with model ${DSH_E2E_MODEL:-deepseek-v4-flash}." >> "$GITHUB_STEP_SUMMARY"
          if [ "$DSH_E2E_PROTOCOL" = openai-completions ]; then
            echo "Only the headless agent suites run; the DeepSeek-wire suites need DEEPSEEK_API_KEY on anthropic-messages and skip." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      # The e2e suites boot the example bins in `lib` mode (DSH_EXAMPLE_MODE=lib):
      # the built artifact under plain Node, resolving plugins through real package
      # exports — the shape a real consumer runs. That requires a prior build.
      - name: Build (lib for the e2e example bins)
        if: steps.key.outputs.present == 'true'
        run: ${{ github.event_name == 'pull_request' && 'pnpm run build:artifacts --profile official' || 'pnpm run build:official' }}

      - name: Prepare Office runtime
        if: steps.key.outputs.present == 'true'
        run: pnpm run prepare:primary-runtime --target linux-x64 --output .cache/e2e-office

      # Real-API end-to-end tests only. The keyless gates (lint/typecheck/
      # coverage/snapshot/etc.) already run in ci.yml (pull requests) and
      # ci-master.yml (master and develop push standby).
      # The secret is scoped to this step only — never exposed to
      # checkout/setup/install or the preflight.
      - name: E2E tests (real DeepSeek API)
        if: steps.key.outputs.present == 'true'
        env:
          DSH_E2E_API_KEY: ${{ secrets.DSH_E2E_API_KEY || secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DSH_E2E_PROTOCOL: ${{ vars.DSH_E2E_PROTOCOL || 'anthropic-messages' }}
          DSH_E2E_BASE_URL: ${{ vars.DSH_E2E_BASE_URL || ((vars.DSH_E2E_PROTOCOL || 'anthropic-messages') == 'anthropic-messages' && 'https://api.deepseek.com/anthropic' || '') }}
          DSH_E2E_MODEL: ${{ vars.DSH_E2E_MODEL }}
          DSH_PRIMARY_RUNTIME: ${{ github.workspace }}/.cache/e2e-office/primary-runtime
          DSH_E2E_MAX_WORKERS: 6
          DSH_EXAMPLE_MODE: lib
        run: |
          set -euo pipefail
          if [ "$DSH_E2E_PROTOCOL" = anthropic-messages ]; then
            export DEEPSEEK_API_KEY="$DSH_E2E_API_KEY" DEEPSEEK_BASE_URL="$DSH_E2E_BASE_URL"
            unset DSH_E2E_API_KEY
          fi
          pnpm run test:e2e
