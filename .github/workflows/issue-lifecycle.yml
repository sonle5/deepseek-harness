name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - closed
      - reopened
      - typed
      - untyped
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    # The lifecycle is driven by the upstream organization's Project board:
    # config.json hardcodes one organization and one project number, and the App
    # token below is scoped to the same identities. A fork has neither, so the
    # job can only ever 404 there — and it is not a read-only check like
    # issue-policy, it *writes* board state, so it must not run against a
    # different repository at all. This one may live on the job: it is not a
    # required check, so removing it in a pull request only makes that pull
    # request's own token mint fail. issue-policy is the opposite case and keeps
    # its exemption in pull-request.mjs for exactly that reason.
    if: >-
      github.repository == 'deepseek-harness/deepseek-harness' &&
      (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create project token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: deepseek-harness
          repositories: deepseek-harness
      - name: Handle repository event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/issue-management/policy.mjs lifecycle
