name: Parity loop

# Routes review and enables auto-merge for pull requests into `develop`, and
# closes the issues those merges fix.
#
# Only `pull_request_target` and `workflow_run` are used. Both load this file
# from a trusted branch (the base, or the default branch), and both jobs check
# out that trusted code, so a PR cannot edit the gate that merges it.
# `pull_request_review` is deliberately absent: GitHub runs review-triggered
# workflows from `refs/pull/N/merge`, so a same-repository PR could edit this
# file and have the edited version run with `contents: write` when its own
# approval arrived. A `workflow_run` payload is read only for pull-request
# numbers; every other fact is read back from the API.
#
# Nothing here decides that a pull request is approved. The loop enables
# GitHub's auto-merge, and GitHub then applies the branch's protection — one
# approving review from someone other than the author and dismissal of stale
# approvals on push — to the commit it merges. That protection requires no
# status checks, so the loop itself requires the gating checks (`GATING_CHECKS`
# in `.github/parity-loop/policy.mjs`) to have passed on the head commit before
# it enables auto-merge pinned to that commit, and turns auto-merge off while
# they fail or run. It re-evaluates when a CI workflow or a review finishes
# (`workflow_run`). GitHub excludes the author from approving, and rejects a
# review request to the author, so the loop routes review through
# `REVIEWERS` in `.github/parity-loop/policy.mjs`: a pull request from outside
# that list goes to its first entry, and an agent-authored pull request goes to
# the most senior other agent in it.
#
# The merge itself is GraphQL-only. `POST /repos/{owner}/{repo}/pulls/{n}/auto_merge`
# does not exist; `enablePullRequestAutoMerge` does, and it takes
# `expectedHeadOid` so the request pins the commit it was enabled for.
#
# Read with care which endpoints this file trusts. The protection *rule*
# (`branchProtectionRule`, or REST `GET .../protection`) is admin-only data and
# reads as null — not as an error — for a workflow token, so it cannot be used
# to decide anything. The gate instead reads two facts a write token can see:
# `branches/{b}.protected` (REST) and the pull request's `reviewDecision`
# (GraphQL), which is null exactly when no rule asks for review.
#
# Auto-merge merges as the identity that enabled it, so loop merges are
# attributed to `github-actions`, and GitHub applies no closing keyword to them:
# the linked issue gets a `referenced` event and stays open. A merge made with
# `GITHUB_TOKEN` also starts no workflow, so `pull_request: closed` never fires
# for it. The `close-issues` job therefore sweeps recent loop merges instead.
# It runs when the approval that releases an auto-merge is recorded (a
# `workflow_run` of `weighted-approval-review-event`, which a reviewer's own
# review starts), on every loop run, and on demand.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - review_requested
      - synchronize
    branches:
      - develop
  workflow_run:
    # The gating checks' workflows, and the approval recorder.
    workflows: [CI, CI Windows, CI Python, Build PR preview, weighted-approval-review-event]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: parity-loop-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  loop:
    name: Route review and enable auto-merge
    # A closed pull request has nothing left to route.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open')
      || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The base commit, or the default branch for `workflow_run`: this step must never run pull-request code.
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run the loop
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/parity-loop/run.mjs

  close-issues:
    name: Close issues fixed by loop merges
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    # One sweep at a time, so two runs cannot both close and comment on the same issue.
    concurrency:
      group: parity-loop-close-issues
      cancel-in-progress: false
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The default branch for every trigger: this job must never run pull-request code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Close fixed issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/parity-loop/run.mjs close-issues
