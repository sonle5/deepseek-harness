name: Policy
on:
  pull_request_target:
    branches: [master, develop, 'release/dsh-[0-9]+.[0-9]+.[0-9]+']
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-check-after-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  approve:
    name: Approve Check
    # The reviewer-ownership check that decides this verdict and publishes `Policy / Reviewer Check` is not available in
    # this repository, so the job runs only to report that MERGE_POLICY_HEAD_DIFF is set; it never passes. While the
    # variable is empty or `off`, the job is skipped.
    if: ${{ vars.MERGE_POLICY_HEAD_DIFF != '' && vars.MERGE_POLICY_HEAD_DIFF != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report the unavailable reviewer-ownership check
        env:
          CHECK_MODE: ${{ vars.MERGE_POLICY_HEAD_DIFF }}
        run: |
          echo "::error title=Approve Check::MERGE_POLICY_HEAD_DIFF is '$CHECK_MODE', but this repository has no reviewer-ownership check, so no review verdict was decided; set the variable to off or delete it"
          exit 1
