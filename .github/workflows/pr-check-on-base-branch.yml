name: Policy
on:
  push:
    branches: [master, develop, 'release/dsh-[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions: {}
concurrency:
  group: pr-check-on-base-branch-${{ github.ref_name }}
jobs:
  recheck:
    name: Recheck
    # Re-runs the head-branch checks, so it follows their variables.
    if: ${{ vars.MERGE_POLICY_MASTER_DIFF != '' && vars.MERGE_POLICY_MASTER_DIFF != 'off' || vars.MERGE_POLICY_PRE_MERGE != '' && vars.MERGE_POLICY_PRE_MERGE != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # A re-run keeps the run's pull-request event, and `Master Change` fetches the base branch again, so it compares
      # with the commit just pushed. A run that is still queued or in progress is left alone.
      - name: Re-run the head-branch checks of open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          prs=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&base=$BASE_REF&per_page=100" --jq '.[] | "\(.number):\(.head.sha)"')
          failed=0
          for pr in $prs; do
            run=$(gh api "repos/$GH_REPO/actions/workflows/pr-check-on-head-branch.yml/runs?event=pull_request_target&head_sha=${pr#*:}&per_page=1" --jq '.workflow_runs[0] | select(. != null) | "\(.id):\(.status)"')
            if [ -z "$run" ]; then
              echo "#${pr%%:*}: no head-branch run to re-run"
            elif [ "${run#*:}" != completed ]; then
              echo "#${pr%%:*}: run ${run%%:*} is ${run#*:}, so it is left alone"
            elif gh run rerun "${run%%:*}"; then
              echo "#${pr%%:*}: re-ran run ${run%%:*}"
            else
              echo "::warning title=Recheck::#${pr%%:*}: run ${run%%:*} could not be re-run"
              failed=1
            fi
          done
          exit "$failed"
