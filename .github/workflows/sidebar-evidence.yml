name: Sidebar evidence (Issue 64, temporary)

on:
  pull_request:
    branches: [agent/sidebar-recents-0bc70be0d2c1]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        label: [before, after]
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Keep the capture scripts
        run: cp -R .github/sidebar-evidence "$RUNNER_TEMP/scripts"
      - name: Select source
        run: |
          if [ "${{ matrix.label }}" = before ]; then git checkout --detach 9b16fe6699765c8e13f5ebcafac6a6082cef15f0; else git checkout --detach 203ba6911dca890e677a1e4bdadd47895e2ab638; fi
          git log --oneline -1
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/source-sha.txt"
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '^24.22.3'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/web exec playwright --version
      - name: Omit the internal Composer release this repository cannot download
        run: |
          node -e "const f='apps/desktop/scripts/composer/lock.json';const fs=require('fs');const l=JSON.parse(fs.readFileSync(f,'utf8'));l.targets['darwin-arm64']={available:false};fs.writeFileSync(f,JSON.stringify(l,null,2)+'\n')"
      - name: Package unsigned arm64 DMG
        run: pnpm run package:desktop:mac:arm64:unsigned
      - name: Capture the sidebar
        if: always()
        run: bash "$RUNNER_TEMP/scripts/capture.sh" "${{ matrix.label }}" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/scripts"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: sidebar-evidence-${{ matrix.label }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 7
