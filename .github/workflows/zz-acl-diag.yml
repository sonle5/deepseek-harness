name: ACL diagnosis (temporary, issue 31)
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: acl-diag-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Probe token and fixture ACLs
        shell: pwsh
        run: ./.github/acl-diag/diag.ps1
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '^24.22.3'
      - name: Install
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Run the ACL specs
        shell: pwsh
        env:
          DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
        run: pnpm exec vitest run packages/sandbox/sandbox-windows-acl/tests/zz-diag.spec.ts --reporter=verbose --silent=false
